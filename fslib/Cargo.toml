[package]
name = "fslib"
version = "0.1.0"
authors = ["Martin Yang <yjjfirst@hotmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
diesel = { version = "2.0.0", features = ["mysql", "chrono"] }
dotenv = "0.15.0"
structopt = "0.3.21"
prettytable-rs = "^0.8"
thiserror = "1.0.26"
chrono = "0.4.19"
regex = "1"
uuid = { version = "1.1.2", features =["serde", "v4"]}
