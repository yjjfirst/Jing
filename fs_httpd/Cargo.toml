[package]
name = "fs_httpd"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.5.1"
actix-cors = "0.7.0"
async-std = { version = "1.8.0", features = ["attributes"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.92"
xml-rs = "0.8.4"
chrono = "0.4.19"
serde-xml-rs = "0.6.0"
lettre = "0.11"
fs_lib = {version="0.1.0", path="../fs_lib"}
