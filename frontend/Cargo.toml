[package]
name = "pbx"
version = "0.1.0"
edition = "2021"
description = "PBX frontend"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["yew", "trunk"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
yew = { version="0.20", features=["csr"] }
yew-router = "0.17"
gloo-dialogs = "0.1.1"
gloo-net = "0.2.6"
gloo-timers = "0.2.6"
gloo-console = "0.2.3"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0.100"
wasm-bindgen = "0.2.87" 
wasm-bindgen-futures  = "0.4"
yew_icons = {version = "0.7", features = ["LucideEdit", "LucideDelete", "LucideUser", "LucideX", "LucideCheck", "LucideChevronDown","LucideChevronUp"]}
yewdux = "0.9.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "HtmlElement",
    "MouseEvent",
    "DomRect",
    "Window",
    "HtmlAnchorElement"
]