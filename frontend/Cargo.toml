[package]
name = "pbx"
version = "0.1.0"
edition = "2021"
description = "PBX frontend"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["yew", "trunk"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
yew = { version="0.21.0", features=["csr"] }
yew-router = "0.18.0"
yew-hooks = "0.3.2"
gloo-dialogs = "0.2.0"
gloo-net = "0.4.0"
gloo-timers = "0.3.0"
gloo-console = "0.3.0"
serde = {version = "1.0.188", features = ["derive"]}
chrono = { version = "0.4.19", features =["serde"]}
serde_json = "1.0.107"
wasm-bindgen = "0.2.87" 
wasm-bindgen-futures  = "0.4.37"
yew_icons = {version = "0.8", features = ["LucideEdit", 
    "LucideDelete", 
    "LucideUser", 
    "LucideX", 
    "LucideCheck", 
    "LucideChevronDown",
    "LucideChevronUp",
    "LucidePlus",
    "LucideTrash"]}
yewdux = "0.9.4"
charming = { features = ["wasm"] }

[dependencies.web-sys]
version = "0.3.66"
features = [
    "console",
    "HtmlElement",
    "HtmlFormElement",
    "MouseEvent",
    "DomRect",
    "Window",
    "HtmlAnchorElement",
    "HtmlDialogElement"
]
