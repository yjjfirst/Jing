[package]
name = "pbx"
version = "0.1.0"
edition = "2021"
description = "PBX frontend"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["yew", "trunk"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
yew = { version="0.23", features=["csr"] }
yew-router = "0.20.0"
yew-hooks = "0.6.4"
gloo-dialogs = "0.2.0"
gloo-net = "0.4.0"
gloo-timers = "0.3.0"
gloo-console = "0.3.0"
gloo-file = "0.3.0"
gloo-utils = "0.2.0"
js-sys = "0.3.70"
serde = {version = "1.0.188", features = ["derive"]}
chrono = { version = "0.4.19", features =["serde"]}
serde_json = "1.0.107"
wasm-bindgen = "0.2.87" 
wasm-bindgen-futures  = "0.4.37"
yew_icons = {version = "0.10", features = ["lucide"]}
yewdux = "0.13"
charming = {version = "0.4.0", features = ["wasm"] }
util_macro = {version = "0.1.0", path = "../util_macro"}

[dependencies.web-sys]
version = "0.3.66"
features = [
    "console",
    "HtmlElement",
    "HtmlFormElement",
    "MouseEvent",
    "DomRect",
    "Window",
    "HtmlAnchorElement",
    "HtmlDialogElement",
    "File",
    "DataTransfer",
    "HtmlSelectElement"
]
